openapi: 3.1.0
info:
  title: TimOS-Agent API (XiaoJu GPT Action — Safe)
  description: |
    Action-safe schema for XiaoJu GPT Action import.

    Includes create and read only. Does NOT include approve or run.
    Jobs created with auto_run_requested may be auto-approved and auto-run
    by local TimOS-Agent policy when they match low-risk inspect-only rules.

    XiaoJu can request auto_run_requested: true, but TimOS-Agent local policy
    decides whether the job actually runs. XiaoJu still cannot call approve
    or run endpoints.

    Use token profile xiaoju-action-create-read (jobs:read, jobs:create only).
  version: 0.6.0

servers:
  - url: https://YOUR-TUNNEL-URL
    description: Public tunnel or deployed coordinator (replace before use)

security:
  - BearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Service health check
      description: Unauthenticated health probe. Does not require a bearer token.
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, version]
                properties:
                  ok:
                    type: boolean
                    example: true
                  service:
                    type: string
                    example: TimOS-Agent
                  version:
                    type: string
                    example: 0.6.0

  /jobs:
    get:
      operationId: listJobs
      summary: List all jobs
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "503":
          $ref: "#/components/responses/AuthNotConfigured"
    post:
      operationId: createJob
      summary: Create a job (optionally request policy auto-run)
      description: |
        Creates a job. By default status is needs_approval.

        When auto_run_requested is true, TimOS-Agent evaluates local policy
        (config/auto-run-policy.json). Eligible low-risk inspect-only jobs are
        auto-approved and started asynchronously with status auto_running.

        Poll GET /jobs/{id} for running/completed/failed. The create response
        returns immediately; Cursor runs in the background without blocking API
        requests.

        Ineligible jobs remain needs_approval and include policy_result.

        XiaoJu cannot approve or run jobs — those endpoints are not in this
        schema and the action token lacks jobs:approve / jobs:run scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "503":
          $ref: "#/components/responses/AuthNotConfigured"

  /jobs/{id}:
    get:
      operationId: getJob
      summary: Get one job by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/AuthNotConfigured"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: xiaoju-action-create-read token (jobs:read, jobs:create only)

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: invalid_token
    InsufficientScope:
      description: Token lacks required scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InsufficientScopeError"
    AuthNotConfigured:
      description: config/auth.json is missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: auth_not_configured

  schemas:
    Job:
      type: object
      required:
        - id
        - workspace
        - workspace_path
        - worker
        - prompt
        - status
        - created_at
        - updated_at
        - result
      properties:
        id:
          type: string
          format: uuid
        workspace:
          type: string
          example: timfinance
        workspace_path:
          type: string
          example: C:\projects\TimFinance
        worker:
          type: string
          enum: [manual, cursor, codex]
        prompt:
          type: string
        status:
          type: string
          enum:
            - queued
            - needs_approval
            - approved
            - auto_running
            - running
            - completed
            - failed
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result:
          nullable: true
        requested_by:
          type: string
          nullable: true
          example: xiaoju
        mode:
          type: string
          nullable: true
          example: read_only
        station:
          type: string
          nullable: true
          example: station1
        task_type:
          type: string
          nullable: true
          example: inspect_only
        risk_level:
          type: string
          nullable: true
          example: low
        auto_run_requested:
          type: boolean
          example: true
        policy_result:
          type: object
          nullable: true
          properties:
            eligible:
              type: boolean
            policy_id:
              type: string
              nullable: true
            reason:
              type: string
            required_approval:
              type: boolean
        approval:
          type: object
          nullable: true
          properties:
            required:
              type: boolean
            approved:
              type: boolean
            approved_by:
              type: string
              nullable: true
            approved_at:
              type: string
              format: date-time
              nullable: true
            approval_note:
              type: string
              nullable: true

    CreateJobRequest:
      type: object
      required: [workspace, worker, prompt]
      properties:
        workspace:
          type: string
          description: Registered workspace id
          example: timfinance
        worker:
          type: string
          description: Worker id
          enum: [manual, cursor, codex]
          example: cursor
        prompt:
          type: string
          description: Task prompt for the worker
          example: Inspect the repository and summarize the app structure. Do not modify files.
        requested_by:
          type: string
          description: Who requested the job
          example: xiaoju
        mode:
          type: string
          description: Execution mode hint
          example: read_only
        station:
          type: string
          description: Target station id for policy evaluation
          example: station1
        task_type:
          type: string
          description: Task classification for policy evaluation
          example: inspect_only
        risk_level:
          type: string
          description: Declared risk level for policy evaluation
          example: low
        auto_run_requested:
          type: boolean
          description: |
            Request TimOS-Agent to evaluate local auto-run policy.
            Policy decides whether the job auto-runs; XiaoJu cannot force execution.
          example: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    InsufficientScopeError:
      type: object
      required: [error, required_scope]
      properties:
        error:
          type: string
          enum: [insufficient_scope]
        required_scope:
          type: string
          example: jobs:read

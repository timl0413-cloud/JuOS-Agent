# Generated by scripts/generate-gpt-action-schema.ps1 from config/juos-room-registry.json
openapi: 3.1.0
info:
  title: JuOS Command Center GPT Actions
  description: Generated JuOS action schema with JuOS task and command-channel actions.
  version: 1.0.0
servers:
  - url: https://juos.vercel.app
security:
  - bearerAuth: []
paths:
  /api/os/assistant/health:
    get:
      operationId: checkTimOsAssistantHealth
      summary: Check Operation Board assistant connectivity
      description: Unauthenticated health check for GPT Actions connectivity testing.
      security: []
      responses:
        "200":
          description: Assistant service is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  timestamp:
                    type: string
                  version:
                    type: string
  /api/os/assistant/echo:
    post:
      operationId: assistantEcho
      summary: Echo request body for connectivity testing
      description: Unauthenticated echo endpoint for GPT Actions connectivity testing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hello:
                  type: string
                source:
                  type: string
      responses:
        "200":
          description: Request body echoed
  /api/os/assistant/tasks:
    post:
      operationId: createTimOsTasks
      summary: Create an Operation Board task
      description: Create one Operation Board task or watchlist item for Tim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project
                - title
              properties:
                project:
                  type: string
                title:
                  type: string
                next_action:
                  type: string
                date:
                  type: string
                time_block:
                  type: string
                target_completion:
                  type: string
                priority:
                  type: string
                  enum: [A1, A2, B1, W, S]
                energy:
                  type: string
                  enum: [Low, Medium, High]
                status:
                  type: string
                  description: Use Waiting for watchlist or pending external items.
                  enum: [Ready, Active, Waiting, Parked, Completed, Cancelled]
                context:
                  type: string
                  enum: [Anywhere, Computer]
                notes:
                  type: string
      responses:
        "200":
          description: Task created
  /api/os/assistant/tasks/search:
    post:
      operationId: searchTimOsTasks
      summary: Search Operation Board tasks
      description: Read-only search for Operation Board tasks by project, title, status, action, or notes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                project:
                  type: string
                title_contains:
                  type: string
                status:
                  type: string
                  enum: [Ready, Active, Waiting, Parked, Completed, Cancelled]
                include_completed:
                  type: boolean
                limit:
                  type: integer
                  description: Max results. Default 10, max 25.
      responses:
        "200":
          description: Matching tasks
  /api/os/assistant/tasks/{id}:
    patch:
      operationId: updateTimOsTask
      summary: Update an Operation Board task
      description: Partial update for one task. Use notes_append to append without replacing notes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project:
                  type: string
                title:
                  type: string
                next_action:
                  type: string
                status:
                  type: string
                  enum: [Ready, Active, Waiting, Parked, Completed, Cancelled]
                notes:
                  type: string
                notes_append:
                  type: string
                  description: Append one note line. Do not send with notes.
      responses:
        "200":
          description: Task updated
  /api/command-channel/remote-jobs:
    get:
      operationId: listCommandChannelJobs
      summary: List command-channel jobs
      description: List command-channel jobs, optionally filtered by status or worker profile.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [awaiting_approval, pending, claimed, completed, failed, cancelled]
        - name: target_worker_profile
          in: query
          schema:
            type: string
            enum:
              - 'finance'
              - 'gsync'
              - 'joa'
              - 'jucore'
              - 'nova'
              - 'ob'
              - 'stuf'
      responses:
        "200":
          description: Job list
    post:
      operationId: createApprovedFinalizeCommandChannelJob
      summary: Create an approved_finalize job
      description: Create an approved_finalize command-channel job using registry-backed profile routing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommandChannelJobRequest'
      responses:
        "201":
          description: Job created and awaiting approval
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "503":
          description: Command-channel storage or auth not configured
  /api/command-channel/remote-jobs/supervised-implement:
    post:
      operationId: createSupervisedImplementCommandChannelJob
      summary: Create a supervised_implement job
      description: Create a low-risk supervised_implement job. Tim approval is still required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CreateCommandChannelJobRequest'
                - type: object
                  required: [prompt, no_source_control_actions]
                  properties:
                    task_type:
                      type: string
                      enum: [supervised_implement]
                    no_source_control_actions:
                      type: boolean
                      enum: [true]
                      description: Must be true. Blocks commit, push, and source-control actions.
      responses:
        "201":
          description: Job created and awaiting approval
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "503":
          description: Command-channel storage or auth not configured
  /api/command-channel/remote-jobs/{id}:
    get:
      operationId: getCommandChannelJob
      summary: Read a command-channel job
      description: Read one command-channel job by id to check status, approval, claim, result, and errors.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Remote job found
        "400":
          description: Invalid job id
        "401":
          description: Unauthorized
        "404":
          description: Job not found
        "503":
          description: Command-channel storage or auth not configured
  /api/command-channel/remote-jobs/{id}/summary:
    get:
      operationId: getCommandChannelJobSummary
      summary: Read a compact command-channel job summary
      description: Read compact job status and result summary without loading large full job results.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Compact remote job summary
        "400":
          description: Invalid job id
        "401":
          description: Unauthorized
        "404":
          description: Job not found
        "503":
          description: Command-channel storage or auth not configured
  /api/command-channel/diagnostics:
    get:
      operationId: getCommandChannelDiagnostics
      summary: Read command-channel diagnostics
      description: Read compact command-channel jobs contract diagnostics from the hosted backend.
      responses:
        "200":
          description: Command-channel diagnostics
        "401":
          description: Unauthorized
        "503":
          description: Command-channel storage or auth not configured
  /api/command-channel/remote-jobs/{id}/approve:
    post:
      operationId: approveCommandChannelJob
      summary: Approve a command-channel job
      description: Approve a job after Tim explicitly approves in chat. Moves it to pending for worker claim.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved_by]
              properties:
                approved_by:
                  type: string
                approval_summary:
                  type: string
                  description: Optional short note recording why Tim approved the job.
      responses:
        "200":
          description: Job approved and ready for worker claim
        "400":
          description: Validation failed or invalid job id
        "401":
          description: Unauthorized
        "503":
          description: Command-channel storage or auth not configured
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: XIAOJU_ACTION_TOKEN, ASSISTANT_API_SECRET, or command-channel approval token.
  schemas:
    CreateCommandChannelJobRequest:
      type: object
      required:
        - repo_ref
        - workspace_ref
        - target_worker_profile
        - task_type
        - risk_level
        - auto_run_requested
        - approval_required
        - plan_summary
      properties:
        repo_ref:
          type: string
          enum:
            - 'JuCore'
            - 'juos-knowledge-vault'
            - 'Nova'
            - 'STUF'
            - 'TimFinance'
            - 'TimOS-Agent'
          description: Repository id from config/juos-room-registry.json.
        workspace_ref:
          type: string
          enum:
            - 'C:\projects\JuCore'
            - 'C:\projects\juos-knowledge-vault'
            - 'C:\projects\Nova'
            - 'C:\projects\SpaceA\STUF-Website'
            - 'C:\projects\TimFinance'
            - 'C:\projects\TimOS-Agent'
          description: Workspace path from config/juos-room-registry.json.
        target_worker_profile:
          type: string
          enum:
            - 'finance'
            - 'gsync'
            - 'joa'
            - 'jucore'
            - 'nova'
            - 'ob'
            - 'stuf'
          description: Worker profile from the generated JuOS room registry.
        task_type:
          type: string
          enum: [inspect_only, supervised_implement, approved_finalize]
        risk_level:
          type: string
          enum: [low]
        auto_run_requested:
          type: boolean
          enum: [true]
        approval_required:
          type: boolean
          enum: [true]
        no_source_control_actions:
          type: boolean
          default: true
          description: Required for supervised implementation jobs.
        plan_summary:
          type: string
          description: Non-empty plan for Tim review and worker execution.
        prompt:
          type: string
          description: Worker prompt. Do not include deploy, env, secrets, commit, or push instructions.
        requested_by:
          type: string
          description: Optional requester label. Defaults to xiaoju when omitted.
        allowlist_paths:
          type: array
          items:
            type: string
          description: Optional paths allowed during approved finalization.
        ignore_paths:
          type: array
          items:
            type: string
          description: Optional paths to skip during approved finalization.
        message:
          type: string
          description: Optional short finalization note for the worker.
        target_branch:
          type: string
          description: Optional branch label for review context only.
